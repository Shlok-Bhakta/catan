services:
  convex:
    image: ghcr.io/get-convex/convex-backend@sha256:01aaebb72d7e9a32c82d183b3a25ffe15278f4dc656ecf30b21777691929d1ab
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    environment:
      INSTANCE_NAME: catan-kiwi
      INSTANCE_SECRET: ${INSTANCE_SECRET:?set INSTANCE_SECRET in .env}
      CONVEX_CLOUD_ORIGIN: http://100.88.30.127:38431
      CONVEX_SITE_ORIGIN: http://100.88.30.127:38432
      DO_NOT_REQUIRE_SSL: "true"
      REDACT_LOGS_TO_CLIENT: "true"
    volumes:
      - /home/shlok/usb1/docker/catan/convex-data:/convex/data
    ports:
      - "100.88.30.127:38431:3210"
      - "100.88.30.127:38432:3211"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard@sha256:1300bccca83da1dc6465962539023eb5ca8fcb11cc98995086326a550855d496
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://100.88.30.127:38431
    ports:
      - "100.88.30.127:38433:6791"
    depends_on:
      convex:
        condition: service_healthy
  web:
    build:
      context: .
      args:
        VITE_CONVEX_URL: http://100.88.30.127:38431
    restart: unless-stopped
    ports:
      - "100.88.30.127:38430:80"
    depends_on:
      convex:
        condition: service_healthy
